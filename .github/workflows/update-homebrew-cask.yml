name: Update Homebrew Cask

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless this release is the latest
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "prerelease, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .id)"
          if [[ "$latest_id" != "$RELEASE_ID" ]]; then
            echo "not the latest release, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release asset and compute sha256
        if: steps.check.outputs.skip != 'true'
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --pattern 'cooViewer.zip' --output cooViewer.zip
          sha256="$(shasum -a 256 cooViewer.zip | awk '{print $1}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-cooviewer
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ysmx/homebrew-cooviewer
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-cooviewer

      - name: Update version, sha256, and url in the cask
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.asset.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          cask="homebrew-cooviewer/Casks/cooviewer.rb"
          new_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/cooViewer.zip"
          sed -i -E "s/^([[:space:]]*version \")[^\"]*(\")/\1${VERSION}\2/" "$cask"
          sed -i -E "s/^([[:space:]]*sha256 \")[^\"]*(\")/\1${SHA256}\2/" "$cask"
          sed -i -E "s|^([[:space:]]*url \")[^\"]*(\")|\1${new_url}\2|" "$cask"
          cat "$cask"

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        working-directory: homebrew-cooviewer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Casks/cooviewer.rb; then
            echo "cask already up to date, nothing to commit"
            exit 0
          fi
          git add Casks/cooviewer.rb
          git commit -m "Update cooViewer cask to ${{ steps.asset.outputs.version }}"
          git push
